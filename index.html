<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Return of the Runners</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </header>
      <nav class="tabs">
        <a id="nav-play" href="#play"></a>
        <a id="nav-edit" href="#edit"></a>
      </nav>
      <section id="play-screen" class="screen">
        <canvas id="screen" width="672" height="384"></canvas>
        <p id="message" class="hint"></p>
      </section>
      <section id="edit-screen" class="screen" hidden>
        <div id="editor-main" class="screen">
          <div class="editor-bar">
            <label
              ><span id="editor-name-label"></span> <input id="editor-name" type="text"
            /></label>
            <label
              ><span id="editor-width-label"></span> <input id="editor-width" type="number"
            /></label>
            <label
              ><span id="editor-height-label"></span> <input id="editor-height" type="number"
            /></label>
            <button id="editor-new" type="button"></button>
            <button id="editor-save" type="button"></button>
            <button id="editor-export" type="button"></button>
            <button id="editor-import" type="button"></button>
            <input id="editor-file" type="file" accept=".json,application/json" hidden />
            <button id="editor-undo" type="button"></button>
            <button id="editor-redo" type="button"></button>
            <button id="editor-test" type="button" class="primary"></button>
          </div>
          <p id="editor-status" class="hint" role="status"></p>
          <div id="editor-errors" class="errors" role="alert" hidden>
            <p id="editor-errors-label"></p>
            <ul id="editor-error-list"></ul>
          </div>
          <div id="editor-palette" class="palette" role="toolbar"></div>
          <canvas id="editor-grid" width="672" height="384"></canvas>
          <p id="editor-hint" class="hint"></p>
          <section class="library">
            <h2 id="my-levels-title"></h2>
            <p id="my-levels-empty" class="hint"></p>
            <ul id="my-levels-list"></ul>
          </section>
        </div>
        <div id="test-screen" class="screen" hidden>
          <canvas id="test-canvas" width="672" height="384"></canvas>
          <p id="test-message" class="hint"></p>
          <button id="test-back" type="button"></button>
        </div>
      </section>
      <p><button id="lang" type="button"></button></p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
