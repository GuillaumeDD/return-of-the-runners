version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1 (see docs/ARCHITECTURE.md § Stack).
      # Remove once typescript-eslint supports TypeScript 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
